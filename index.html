<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EA ATLAS - Architecture, Technology Landscapes and Solutions</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="assets/ea_atlas_logo.png" alt="" class="brand-logo">
    <div class="brand-text">
      <div class="brand-title">EA ATLAS</div>
      <div class="brand-sub">Architecture, Technology Landscapes and Solutions</div>
    </div>
  </div>
</header>

<div class="brand-bar"></div>

<nav class="primary-nav" id="primary-nav"></nav>
<nav class="secondary-nav" id="secondary-nav"></nav>

<main id="view" class="view"></main>

<footer class="app-footer">
  <span>ATLAS prototype · v0.1 · running locally with local files</span>
  <span class="env-tag">data source: <strong id="data-source">local files</strong></span>
</footer>

<!-- Data files: one per entity, loaded before the data layer -->
<script src="data/domains.js"></script>
<script src="data/capabilities.js"></script>
<script src="data/applications.js"></script>
<script src="data/taxonomy.js"></script>
<script src="data/technologies.js"></script>
<script src="data/projects.js"></script>
<script src="data/tech-debt.js"></script>
<script src="data/strategies.js"></script>
<!-- Data layer abstraction — swap build('local') to build('sharepoint') to migrate -->
<script src="js/data.js"></script>

<!-- Views -->
<script src="js/views/about.js"></script>
<script src="js/views/strategies.js"></script>
<script src="js/views/bcm.js"></script>
<script src="js/views/applications.js"></script>
<script src="js/views/taxonomy.js"></script>
<script src="js/views/standards.js"></script>
<script src="js/views/solarchitecture.js"></script>
<script src="js/views/configstandards.js"></script>
<script src="js/views/techdebt.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/roadmap.js"></script>

<!-- App shell + router -->
<script src="js/app.js"></script>

</body>
</html>
